name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The app itself has no runtime dependencies; this only fetches the
      # two build tools used for packaging.
      - name: Install build tooling
        run: npm ci

      - name: Pairing and short-authentication-string tests
        run: node test/pairing.js

      - name: Protocol, consent and authorization tests
        run: node test/protocol.js

      - name: End-to-end transfer test
        run: node test/e2e.js

  android-core:
    name: android protocol core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Only the pure-Kotlin core: it has no Android imports, so it needs no
      # SDK and no emulator. That is the point of keeping it separate.
      - name: Test the protocol core
        working-directory: android
        run: ./gradlew :core:test --no-daemon

      # The app module needs the SDK, but lint is what catches a manifest that
      # names a class the APK does not contain — which builds cleanly and then
      # dies on launch.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Lint the app
        working-directory: android
        run: ./gradlew :app:lintDebug --no-daemon

      # R8 strips anything it cannot see being used, and BouncyCastle's
      # provider reaches its algorithms by name at run time. A rule that stops
      # covering them produces a smaller APK that fails at the first handshake,
      # so the shrunk build is at least assembled on every push.
      - name: Build the shrunk release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon
