name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # Intel macOS runners are being retired and can sit unscheduled for a long
    # time. That platform is allowed to fail so it never holds up a release;
    # Intel users can still run from source.
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (x64)
            artifact: flyshare-win-x64.exe
          - os: macos-15-intel
            label: macOS (Intel)
            artifact: flyshare-darwin-x64
            optional: true
          - os: macos-14
            label: macOS (Apple Silicon)
            artifact: flyshare-darwin-arm64
          - os: ubuntu-latest
            label: Linux (x64)
            artifact: flyshare-linux-x64

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      # Never ship a build that cannot pass its own tests.
      - name: Test
        run: npm test

      - name: Build single executable
        run: npm run build

      - name: Check the executable starts
        shell: bash
        run: |
          BIN="dist/${{ matrix.artifact }}"
          chmod +x "$BIN" 2>/dev/null || true
          FLYSHARE_HOME="$(mktemp -d)" FLYSHARE_UI_PORT=45899 "$BIN" --no-open > start.log 2>&1 &
          sleep 8
          cat start.log
          grep -q "open the UI" start.log

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      # Never ship a build that cannot pass its own tests.
      - name: Test the protocol core
        working-directory: android
        run: ./gradlew :core:test --no-daemon

      # The keystore lives in a secret, never in the repository: whoever holds
      # it can publish an update that Android installs over this app. With no
      # secret set — a fork, or before a key exists — the build still runs and
      # produces an unsigned APK, which cannot be installed and so cannot be
      # mistaken for something shippable.
      - name: Restore the signing key
        id: keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "No signing key configured; this APK will be unsigned."
          fi

      - name: Build the APK
        working-directory: android
        env:
          FLYSHARE_STOREFILE: ${{ steps.keystore.outputs.path }}
          FLYSHARE_STOREPASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLYSHARE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FLYSHARE_KEYPASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Name it after the product, not the build system
        run: |
          cd android/app/build/outputs/apk/release
          ls -lh
          SRC=$(ls app-release*.apk | head -1)
          case "$SRC" in
            *unsigned*) DEST=flyshare-android-unsigned.apk ;;
            *)          DEST=flyshare-android.apk ;;
          esac
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$SRC" "$GITHUB_WORKSPACE/dist/$DEST"
          echo "built $DEST"

      - uses: actions/upload-artifact@v7
        with:
          name: flyshare-android
          path: dist/*.apk
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Fail if nothing was built
        run: test -n "$(ls -A artifacts)"

      - name: List what will be published
        run: ls -lh artifacts

      - name: Create or update the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          files: artifacts/*
          body: |
            Download the file for your system, then run it. No installer, no Node.js required.

            | System | File |
            |---|---|
            | Windows 10/11 (x64) | `flyshare-win-x64.exe` |
            | macOS (Apple Silicon) | `flyshare-darwin-arm64` |
            | macOS (Intel) | `flyshare-darwin-x64` (best effort — build from source if missing) |
            | Linux (x64) | `flyshare-linux-x64` |
            | Android 8+ | `flyshare-android.apk` |

            **macOS and Linux** — mark it executable first:
            ```
            chmod +x flyshare-darwin-arm64 && ./flyshare-darwin-arm64
            ```

            **macOS Gatekeeper.** These builds are signed ad-hoc, not with a paid
            Developer ID, so macOS will refuse the first launch. Open it once with
            Control-click → Open, or clear the quarantine flag:
            ```
            xattr -d com.apple.quarantine flyshare-darwin-arm64
            ```

            **Windows SmartScreen** will warn for the same reason — the build is
            unsigned. Choose "More info" → "Run anyway".

            **Android** is not on Google Play, so the APK is installed directly.
            Open the downloaded file and allow installation from this source when
            asked. It needs Android 8 or newer, and the phone has to be on the
            same Wi-Fi as the computer — this app never uses the internet.

            Run it on both devices, compare the six-digit code once, and the two
            are paired for good.
