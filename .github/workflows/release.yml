name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (x64)
            artifact: flyshare-win-x64.exe
          - os: macos-13
            label: macOS (Intel)
            artifact: flyshare-darwin-x64
          - os: macos-14
            label: macOS (Apple Silicon)
            artifact: flyshare-darwin-arm64
          - os: ubuntu-latest
            label: Linux (x64)
            artifact: flyshare-linux-x64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Never ship a build that cannot pass its own tests.
      - name: Test
        run: npm test

      - name: Build single executable
        run: npm run build

      - name: Check the executable starts
        shell: bash
        run: |
          BIN="dist/${{ matrix.artifact }}"
          chmod +x "$BIN" 2>/dev/null || true
          FLYSHARE_HOME="$(mktemp -d)" FLYSHARE_UI_PORT=45899 "$BIN" --no-open > start.log 2>&1 &
          sleep 8
          cat start.log
          grep -q "open the UI" start.log

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be published
        run: ls -lh artifacts

      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          files: artifacts/*
          body: |
            Download the file for your system, then run it. No installer, no Node.js required.

            | System | File |
            |---|---|
            | Windows 10/11 (x64) | `flyshare-win-x64.exe` |
            | macOS (Apple Silicon) | `flyshare-darwin-arm64` |
            | macOS (Intel) | `flyshare-darwin-x64` |
            | Linux (x64) | `flyshare-linux-x64` |

            **macOS and Linux** — mark it executable first:
            ```
            chmod +x flyshare-darwin-arm64 && ./flyshare-darwin-arm64
            ```

            **macOS Gatekeeper.** These builds are signed ad-hoc, not with a paid
            Developer ID, so macOS will refuse the first launch. Open it once with
            Control-click → Open, or clear the quarantine flag:
            ```
            xattr -d com.apple.quarantine flyshare-darwin-arm64
            ```

            **Windows SmartScreen** will warn for the same reason — the build is
            unsigned. Choose "More info" → "Run anyway".

            Run it on both computers, compare the six-digit code once, and the two
            are paired for good.
